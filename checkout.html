<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HobbyForge | Checkout</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >

</head>


<body>


  <!-- ================= NAVBAR ================= -->

  <header class="navbar">

    <div class="container">

      <a
        href="index.html"
        class="nav-brand"
      >
        HobbyForge
      </a>


      <ul
        class="nav-links"
        id="nav-links"
      >

        <li>
          <a href="index.html">
            Home
          </a>
        </li>

        <li>
          <a href="products.html">
            Shop
          </a>
        </li>

      </ul>


      <div class="nav-right">

        <button
          class="cart-btn js-open-cart"
          aria-label="Open cart"
        >

          Cart

          <span
            class="cart-count js-cart-count"
          >
            0
          </span>

        </button>


        <button
          class="mobile-menu-toggle"
          id="mobile-menu-toggle"
          aria-label="Toggle menu"
        >

          <span></span>
          <span></span>
          <span></span>

        </button>

      </div>

    </div>

  </header>


  <!-- ================= CHECKOUT HEADER ================= -->

  <section
    class="hero"
    style="padding:40px 0;"
  >

    <div class="container">

      <h1
        style="font-size:28px;"
      >
        Checkout
      </h1>

      <p>
        Review your order and provide your information.
      </p>

    </div>

  </section>


  <!-- ================= CHECKOUT ================= -->

  <section>

    <div class="container">


      <!-- EMPTY CART -->

      <div
        id="checkout-empty"
        style="display:none; text-align:center;"
      >

        <h2>
          Your cart is empty
        </h2>

        <p>
          Add products before proceeding to checkout.
        </p>

        <a
          href="products.html"
          class="btn btn-primary"
        >
          Continue Shopping
        </a>

      </div>


      <!-- CHECKOUT CONTENT -->

      <div
        id="checkout-layout"
      >


        <!-- CUSTOMER FORM -->

        <div
          class="checkout-customer-section"
        >

          <h2>
            Customer Information
          </h2>


          <form
            id="checkout-form"
            novalidate
          >

            <div class="form-group">

              <label
                for="checkout-name"
              >
                Full Name
              </label>

              <input
                type="text"
                id="checkout-name"
                required
              >

            </div>


            <div class="form-group">

              <label
                for="checkout-email"
              >
                Email Address
              </label>

              <input
                type="email"
                id="checkout-email"
                required
              >

            </div>


            <div class="form-group">

              <label
                for="checkout-phone"
              >
                Phone Number
              </label>

              <input
                type="tel"
                id="checkout-phone"
                required
              >

            </div>


            <div class="form-group">

              <label
                for="checkout-address"
              >
                Delivery Address
              </label>

              <textarea
                id="checkout-address"
                required
              ></textarea>

            </div>


            <div
              id="checkout-form-message"
              class="checkout-form-message"
            ></div>


            <button
              type="submit"
              class="btn btn-primary btn-full"
            >
              Continue
            </button>

          </form>

        </div>


        <!-- ORDER SUMMARY -->

        <div
          class="checkout-summary"
        >

          <div
            class="checkout-summary-header"
          >

            <h2>
              Order Summary
            </h2>

            <span
              id="checkout-item-count"
            >
              0 Items
            </span>

          </div>


          <div
            id="checkout-items"
          ></div>


          <div
            class="checkout-totals"
          >

            <div>

              <span>
                Subtotal
              </span>

              <span
                id="checkout-subtotal"
              >
                $0.00
              </span>

            </div>


            <div
              class="checkout-total-row"
            >

              <strong>
                Total
              </strong>

              <strong
                id="checkout-total"
              >
                $0.00
              </strong>

            </div>

          </div>

        </div>


      </div>


    </div>

  </section>


  <!-- ================= CART DRAWER ================= -->

  <div
    class="cart-drawer"
    id="cart-drawer"
  >

    <div
      class="cart-drawer-header"
    >

      <h3>
        Your Cart
      </h3>


      <button
        class="modal-close-btn"
        id="cart-close-btn"
        style="position:static;"
      >
        &times;
      </button>

    </div>


    <div
      class="cart-items"
      id="cart-items"
    ></div>


    <div
      class="cart-drawer-footer"
    >

      <div
        class="cart-total-row"
      >

        <span>
          Total
        </span>

        <span
          id="cart-total"
        >
          $0.00
        </span>

      </div>


      <button
        class="btn btn-primary btn-full"
        id="checkout-btn"
      >
        Checkout
      </button>

    </div>

  </div>


  <div
    class="cart-overlay"
    id="cart-overlay"
  ></div>


  <!-- ================= SCRIPTS ================= -->

  <script src="js/data.js"></script>

  <script src="js/cart.js"></script>

  <script src="js/Orders.js"></script>

  <script src="js/checkout.js"></script>

  <script src="js/app.js"></script>


</body>

</html>
